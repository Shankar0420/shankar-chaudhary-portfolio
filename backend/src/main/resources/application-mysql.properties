# MySQL / MariaDB Production Profile Configuration
# Activate via: java -jar app.jar --spring.profiles.active=mysql
# Or environment: SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=${DATABASE_URL:${MYSQL_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:${MYSQL_USER:${DB_USER:root}}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:root}}}

# Safe automatic schema evolution without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000


