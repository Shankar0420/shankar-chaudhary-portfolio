# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# Default Database: Embedded Persistent H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./backend/data/portfoliodb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 Console (Disabled by default)
spring.h2.console.enabled=false

# Static Upload Directory
portfolio.upload.dir=${PORTFOLIO_UPLOAD_DIR:./backend/uploads}
