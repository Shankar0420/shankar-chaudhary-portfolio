# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# Default Database: Embedded Persistent H2 (Zero-configuration, persists to ./backend/data/portfoliodb)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./backend/data/portfoliodb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Disabled by default to prevent port conflicts)
spring.h2.console.enabled=false

# Multipart File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Custom Portfolio Storage and Security Configuration
portfolio.upload.dir=${PORTFOLIO_UPLOAD_DIR:./backend/uploads}
portfolio.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
portfolio.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
portfolio.admin.authorized-mobile=${ADMIN_MOBILE:9905340058}
portfolio.admin.max-failed-attempts=${ADMIN_MAX_ATTEMPTS:5}
portfolio.admin.lockout-minutes=${ADMIN_LOCKOUT_MINUTES:15}

